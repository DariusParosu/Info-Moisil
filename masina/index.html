<!DOCTYPE HTML>
<html>
  <head>
    <title>OpenLayers Demo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
     <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <style type="text/css">
      #map {
        height: 400px;
        width: 600px;
      }
    </style>
  </head>
  <body>
    <div class="masina-emisii-content">
      

    <div id="map"></div>
    
      <div class="map-marker-buttons-div">
        <button onclick="selectOrigineFunc()">Selecteaza Originea</button>
        <button onclick="selectDestinatieFunc()">Selecteaza Destinatia</button>
      </div>


      <script>
        var selOrigine = false;
        var selDestinatie = false;

        var esteOrigine = false;
        var esteDestinatie = false;

        var origineLatLng = L.latLng(0, 0);
        var destinatieLatLng = L.latLng(0, 0);

        var traseuOdata = false;

        var map = L.map('map').setView([51.505, -0.09], 13);

        var route = L.Routing;

        

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        var markerOrigine = L.marker([0.0,0.0]).addTo(map);
        var markerDestinatie = L.marker([0.0,0.0]).addTo(map);
        markerOrigine.setOpacity(0);
        markerDestinatie.setOpacity(0);

        function onMapClick(e) {
          if(selOrigine == true && esteOrigine == false) {
            markerOrigine.setLatLng(e.latlng);
            markerOrigine.setOpacity(1);
            selOrigine = false;
            esteOrigine = true;
          }
          if(selDestinatie == true && esteDestinatie == false) {
            markerDestinatie.setLatLng(e.latlng);
            markerDestinatie.setOpacity(1);
            selDestinatie = false;
            esteDestinatie = true;
          }
          
          if(esteOrigine == true && esteDestinatie == true && traseuOdata == false) {
            route = L.Routing.control({
            waypoints: [
            L.latLng(markerOrigine.getLatLng()),
            L.latLng(markerDestinatie.getLatLng())
            ]
            }).addTo(map);
            markerOrigine.setOpacity(0);
            markerDestinatie.setOpacity(0);
            traseuOdata = true;
            route.on('routesfound', avemDistanta);
          }
        }

        function selectOrigineFunc(){
          if(esteOrigine == false) {
            selOrigine = !selOrigine;
            selDestinatie = false;
          }
        }

        function selectDestinatieFunc(){
          if(esteDestinatie == false) {
            selDestinatie = !selDestinatie;
            selOrigine = false;
          }
        }

        function avemDistanta(e) {
          alert(e.routes[0].summary.totalDistance);
        }

        map.on('click', onMapClick);
    </script>
    </div>
  </body>
</html>
